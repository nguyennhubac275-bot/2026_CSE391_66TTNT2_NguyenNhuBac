<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Contact Form Flexbox</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f2f2f2;
        }

        .wrapper {
            width: 900px;
            margin: 30px auto;
            border: 2px solid #333;
            background: #e9e9e9;
            padding: 30px;
        }

        h2 {
            margin-bottom: 25px;
            color: #333;
        }

        /* Flex row cho 2 input đầu */
        .row {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .row input {
            flex: 1;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 3px;
            font-size: 14px;
            box-sizing: border-box;
        }

        textarea {
            height: 200px;
            resize: none;
            margin-bottom: 20px;
        }

        /* Hàng cuối: button trái, text phải */
        .bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        button {
            background: #5dade2;
            border: none;
            padding: 12px 25px;
            color: white;
            font-size: 14px;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background: #3498db;
        }

        .note {
            color: #666;
            font-size: 14px;
        }

        .required {
            color: red;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <h2>Get in touch with us by filling contact form below</h2>

        <form>
            <div class="row">
                <input type="text" placeholder="* Enter your full name" required>
                <input type="email" placeholder="* Enter your email address" required>
            </div>

            <input type="text" placeholder="Enter your subject">

            <br><br>

            <textarea placeholder="* Your message here..." required></textarea>

            <div class="bottom">
                <button type="submit">Send message</button>
                <div class="note">
                    <span class="required">*</span> Please fill all required form field, thanks!
                </div>
            </div>
        </form>
    </div>

</body>
</html>
