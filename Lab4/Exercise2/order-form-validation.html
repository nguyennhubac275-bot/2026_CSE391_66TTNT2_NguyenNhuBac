<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Order Form Validation</title>

<style>

body{
font-family:Arial;
padding:40px;
}

form{
width:400px;
}

label{
display:block;
margin-top:15px;
}

input,select,textarea{
width:100%;
padding:8px;
margin-top:5px;
}

.error{
color:red;
font-size:14px;
display:none;
}

.invalid{
border:2px solid red;
}

.success{
border:2px solid green;
}

#charCount{
font-size:13px;
}

#totalPrice{
margin-top:15px;
font-weight:bold;
}

#confirmBox{
display:none;
border:1px solid #ccc;
padding:20px;
margin-top:20px;
background:#f9f9f9;
}

</style>
</head>

<body>

<h2>Đặt Hàng Online</h2>

<form id="orderForm">

<label>Tên sản phẩm</label>
<select id="product">
<option value="">-- Chọn sản phẩm --</option>
<option value="ao">Áo</option>
<option value="quan">Quần</option>
<option value="giay">Giày</option>
</select>
<span class="error" id="productError"></span>

<label>Số lượng</label>
<input type="number" id="quantity">
<span class="error" id="quantityError"></span>

<label>Ngày giao hàng</label>
<input type="date" id="deliveryDate">
<span class="error" id="dateError"></span>

<label>Địa chỉ giao</label>
<input id="address">
<span class="error" id="addressError"></span>

<label>Ghi chú</label>
<textarea id="note"></textarea>
<div id="charCount">0 / 200</div>
<span class="error" id="noteError"></span>

<label>Thanh toán</label>
<input type="radio" name="payment" value="COD"> COD
<input type="radio" name="payment" value="Bank"> Chuyển khoản
<input type="radio" name="payment" value="Wallet"> Ví điện tử
<span class="error" id="paymentError"></span>

<div id="totalPrice">Tổng tiền: 0</div>

<br>

<button type="submit">Đặt hàng</button>

</form>

<div id="confirmBox">
<h3>Xác nhận đơn hàng</h3>
<div id="orderSummary"></div>

<button id="confirmBtn">Xác nhận</button>
<button id="cancelBtn">Hủy</button>
</div>

<div id="successMessage"></div>

<script src="script1.js"></script>

</body>
</html>
