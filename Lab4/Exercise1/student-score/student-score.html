<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Bảng Điểm Sinh Viên</title>

<style>
body{
    font-family: Arial;
    padding: 30px;
}

input{
    padding:6px;
    margin-right:10px;
}

button{
    padding:6px 12px;
}

table{
    border-collapse: collapse;
    width:600px;
    margin-top:20px;
}

th,td{
    border:1px solid #ccc;
    padding:8px;
    text-align:center;
}

th{
    background:#eee;
}

.low{
    background:yellow;
}

#stats{
    margin-top:15px;
    font-weight:bold;
}
</style>
</head>

<body>

<h2>Quản Lý Điểm Sinh Viên</h2>

<input id="name" placeholder="Họ tên">
<input id="score" type="number" step="0.1" placeholder="Điểm (0-10)">
<button id="addBtn">Thêm</button>

<table>
<thead>
<tr>
<th>STT</th>
<th>Họ tên</th>
<th>Điểm</th>
<th>Xếp loại</th>
<th>Thao tác</th>
</tr>
</thead>

<tbody id="tableBody">
</tbody>
</table>

<div id="stats">
Tổng SV: 0 | Điểm TB: 0
</div>

<script src="script.js"></script>

</body>
</html>
