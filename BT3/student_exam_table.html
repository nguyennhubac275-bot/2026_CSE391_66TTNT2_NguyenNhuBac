<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>HTML Table</title>
    <style>
        body {
            font-family: "Times New Roman", serif;
        }
        table {
            border-collapse: collapse;
            margin: 20px auto;
        }
        th, td {
            border: 1px solid black;
            padding: 8px 12px;
            text-align: center;
            vertical-align: middle;
        }
        th {
            font-weight: bold;
        }
    </style>
</head>
<body>

<table>
    <!-- Hàng 1 -->
    <tr>
        <th colspan="2">Student</th>
        <th colspan="4">Exam</th>
        <th colspan="4">2nd Exam</th>
        <th colspan="2">Final Grade</th>
    </tr>

    <!-- Hàng 2 -->
    <tr>
        <th rowspan="2">Code</th>
        <th rowspan="2">Name</th>

        <th>Q1</th>
        <th>Q2</th>
        <th>Q3</th>
        <th rowspan="2">Grade</th>

        <th>Q1</th>
        <th>Q2</th>
        <th>Q3</th>
        <th rowspan="2">Grade</th>

        <th>NR</th>
        <th>R</th>
    </tr>

    <!-- Hàng 3 -->
    <tr>
        <th>8</th>
        <th>7</th>
        <th>5</th>

        <th>6</th>
        <th>7</th>
        <th>8</th>
    </tr>

    <!-- Dữ liệu -->
    <tr>
        <td>80549061</td>
        <td>John</td>
        <td>70%</td>
        <td>100%</td>
        <td>100%</td>
        <td>17.6</td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td>17.6</td>
        <td>18</td>
    </tr>

    <tr>
        <td>80549062</td>
        <td>Mary</td>
        <td>10%</td>
        <td>50%</td>
        <td>50%</td>
        <td>6.8</td>
        <td>100%</td>
        <td>100%</td>
        <td>50%</td>
        <td>16.5</td>
        <td>16.5</td>
        <td>17</td>
    </tr>

    <tr>
        <td>80549063</td>
        <td>Claire</td>
        <td></td>
        <td></td>
        <td></td>
        <td></td>
        <td>50%</td>
        <td>50%</td>
        <td>50%</td>
        <td>10.0</td>
        <td>10.0</td>
        <td>10</td>
    </tr>
</table>

</body>
</html>
