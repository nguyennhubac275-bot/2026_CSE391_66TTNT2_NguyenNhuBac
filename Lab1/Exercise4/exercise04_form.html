<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>exercise04 - Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
        }

        form {
            width: 720px;
            margin: 20px auto;
            background: #fff;
            padding: 20px;
            border: 1px solid #ccc;
        }

        fieldset {
            border: none;
            border-top: 1px solid #999;
            margin-bottom: 20px;
        }

        legend {
            font-weight: bold;
            padding: 0 10px;
        }

        .row {
            display: flex;
            align-items: center;
            margin: 8px 0;
        }

        .row label {
            width: 150px;
            font-weight: bold;
        }

        .row input,
        .row select,
        .row textarea {
            flex: 1;
            padding: 5px;
        }

        textarea {
            height: 140px;
        }

        .buttons {
            text-align: right;
            margin-top: 20px;
        }

        .buttons button {
            padding: 6px 12px;
            margin-left: 5px;
            border: 1px solid #999;
            background: #eee;
            cursor: pointer;
        }

        .buttons button:hover {
            background: #ddd;
        }

        .required-note {
            float: left;
            margin-top: 25px;
            font-size: 13px;
        }
    </style>
</head>
<body>

<form>

    <!-- BASIC INFO -->
    <fieldset>
        <legend>Basic Info</legend>

        <div class="row">
            <label>Employee ID</label>
            <input type="text" value="9" readonly>
        </div>

        <div class="row">
            <label>Last Name</label>
            <input type="text" value="Dodsworth">
        </div>

        <div class="row">
            <label>First Name</label>
            <input type="text" value="Anne">
        </div>

        <div class="row">
            <label>Gender</label>
            <input type="radio" name="gender"> Male
            <input type="radio" name="gender"> Female
            <input type="radio" name="gender"> XXX
            <input type="radio" name="gender" checked> ZZZ
        </div>

        <div class="row">
            <label>Title</label>
            <input type="text" value="Sales Representative">
        </div>

        <div class="row">
            <label>Suffix</label>
            <input type="text" value="Ms.">
        </div>

        <div class="row">
            <label>BirthDate</label>
            <input type="text" value="1969-07-02 00:00:00">
        </div>

        <div class="row">
            <label>HireDate</label>
            <input type="text" value="1994-11-15 00:00:00">
        </div>

        <div class="row">
            <label>SSN #</label>
            <input type="password">
        </div>

        <div class="row">
            <label>Reports To</label>
            <select>
                <option>Buchanan</option>
                <option>Fuller</option>
                <option>King</option>
            </select>
        </div>
    </fieldset>

    <!-- CONTACT INFO -->
    <fieldset>
        <legend>Contact Info</legend>

        <div class="row">
            <label>Email</label>
            <input type="email" placeholder="name@example.com">
        </div>

        <div class="row">
            <label>Address</label>
            <input type="text" value="7 Houndstooth Rd.">
        </div>

        <div class="row">
            <label>City</label>
            <input type="text" value="London">
        </div>

        <div class="row">
            <label>Region</label>
            <input type="text">
        </div>

        <div class="row">
            <label>Postal Code</label>
            <input type="text" value="WG2 7LT">
        </div>

        <div class="row">
            <label>Country</label>
            <select>
                <option>Russian Federation</option>
                <option>USA</option>
                <option>UK</option>
            </select>
        </div>

        <div class="row">
            <label>US Home Phone</label>
            <input type="text" value="(234)234-2342">
        </div>

        <div class="row">
            <label>Photo</label>
            <input type="text" value="EmpID9.bmp">
        </div>
    </fieldset>

    <!-- OPTIONAL INFO -->
    <fieldset>
        <legend>Optional Info</legend>

        <div class="row">
            <label>Notes</label>
            <div style="flex:1">
                <div style="border:1px solid #999; background:#eee; padding:5px">
                    B&nbsp; I&nbsp; U&nbsp; |&nbsp; H1&nbsp; H2&nbsp; H3&nbsp; |&nbsp; ✖
                </div>
                <textarea>
Anne has a BA degree in English from St. Lawrence College.
She is fluent in French and German.ZZZ
                </textarea>
            </div>
        </div>

        <div class="row">
            <label>Preferred Shift</label>
            <input type="checkbox"> Regular
            <input type="checkbox" checked> Gravy Yard
        </div>

        <div class="row">
            <label>Active?</label>
            <input type="checkbox" checked>
        </div>

        <div class="row">
            <label>Are you human?</label>
            <div style="flex:1">
                <div style="font-family: monospace; font-size: 26px; letter-spacing: 4px;">
                    TIDANO
                </div>
                <small>Click to change</small><br>
                <input type="text">
            </div>
        </div>
    </fieldset>

    <!-- REQUIRED + BUTTONS -->
    <div class="required-note">
        <span style="color:red">*</span> required
    </div>

    <div class="buttons">
        <button type="submit">⬆ Submit</button>
        <button type="reset">✖ Cancel</button>
    </div>

    <div style="clear: both;"></div>

</form>

</body>
</html>
